name: aerogate-aodb

services:
  app:
    build:
      context: .
      args:
        APP_GID: ${APP_GID:-1000}
        APP_UID: ${APP_UID:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-local-only}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aerogate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only}
      POSTGRES_USER: ${DB_USERNAME:-aerogate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data

volumes:
  composer_vendor:
  postgres_data:
